<!doctype html><html lang="it"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="BradiFit">
<meta name="theme-color" content="#1F4D36"><style>:root{padding-top:env(safe-area-inset-top,0px)}img{max-width:100%}</style>
<title>BradiFit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#EAF1EC;--surface:#FFFFFF;--surface2:#F2F7F3;--ink:#1B2A20;--muted:#5A6B5F;--line:#D3E0D6;
  --accent:#FF5A36;--accent-ink:#FFFFFF;--accent-soft:#FFE7E0;--leaf:#2F6B45;--leaf-deep:#1F4D36;--leaf-soft:#DCEDE1;--good:#1E9E62;--blue:#3C8DC4;
  --gnd:rgba(27,42,32,.10);
  --display:"Fredoka","Arial Rounded MT Bold",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;--bg:#0E1511;--surface:#17211A;--surface2:#1E2A22;--ink:#E7F0E9;--muted:#93A597;--line:#28372C;
  --accent:#FF6A48;--accent-soft:#3A2019;--leaf:#7FC08B;--leaf-deep:#1F4D36;--leaf-soft:#1D3325;--good:#3CC985;--blue:#6FB3E0;--gnd:rgba(0,0,0,.35)}}
:root[data-theme="dark"]{
  color-scheme:dark;--bg:#0E1511;--surface:#17211A;--surface2:#1E2A22;--ink:#E7F0E9;--muted:#93A597;--line:#28372C;
  --accent:#FF6A48;--accent-soft:#3A2019;--leaf:#7FC08B;--leaf-deep:#1F4D36;--leaf-soft:#1D3325;--good:#3CC985;--blue:#6FB3E0;--gnd:rgba(0,0,0,.35)}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{margin:0;font:15px/1.45 var(--body);color:var(--ink);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:disabled{opacity:.5;cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,textarea,select{font:inherit;color:var(--ink)}
h1,h2,h3,h4{margin:0;font-family:var(--display);font-weight:600;text-wrap:balance;line-height:1.05}
.wrap{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:14px 110px}
.lbl{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:13px}
.num{font-variant-numeric:tabular-nums}
.row{display:flex;align-items:center;gap:10px}
.wrapr{flex-wrap:wrap}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:12px}
.sec{margin-top:26px;display:flex;flex-direction:column;gap:12px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.sec-h h3{font-size:22px}
.card{background:var(--surface);border-radius:18px;padding:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 22px;border-radius:999px;font-weight:700;background:var(--accent);color:var(--accent-ink);white-space:nowrap}
.btn.ghost{background:var(--surface2);color:var(--ink)}
.btn.line{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn.leaf{background:var(--leaf);color:#fff}
.btn.sm{height:36px;padding:0 14px;font-size:13px}
.btn.danger{background:#D6452A;color:#fff}
.btn.full{width:100%}
.chip{display:inline-flex;align-items:center;height:34px;padding:0 14px;border-radius:999px;background:var(--surface);font-weight:600;font-size:13px;white-space:nowrap}
.chip.on{background:var(--ink);color:var(--bg)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding-inline:16px}
.chips::-webkit-scrollbar{display:none}
.seg{display:flex;background:var(--surface);border-radius:999px;padding:4px;gap:4px}
.seg button{flex:1;height:38px;border-radius:999px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--ink);color:var(--bg)}
.pill{white-space:nowrap;display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:99px;font-size:11px;font-weight:700;background:var(--surface2);color:var(--muted)}
.pill.acc{background:var(--accent-soft);color:var(--accent)}
.pill.leaf{background:var(--leaf-soft);color:var(--leaf)}

/* top */
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding-top:6px}
.top h1{font-size:36px}
.streak{display:flex;flex-direction:column;align-items:center;background:var(--surface);border-radius:14px;padding:8px 12px;min-width:66px}
.streak b{font-family:var(--display);font-size:26px;line-height:1}
.streak span{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:center}

/* bradi card */
.bcard{display:grid;grid-template-columns:118px 1fr;gap:10px;align-items:center;background:var(--surface);border-radius:22px;padding:8px 14px 8px 6px;margin-top:14px}
.bcard .bf{width:118px}
.bubble{position:relative;background:var(--surface2);border-radius:16px;padding:10px 12px;font-weight:600;font-size:15px}
.bubble::before{content:"";position:absolute;left:-7px;top:18px;border:7px solid transparent;border-left:0;border-right-color:var(--surface2)}
.stagebar{display:flex;flex-direction:column;gap:5px;margin-top:8px}
.stagebar .row span{font-size:12px}

.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:16px}
.day{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;font-weight:600;color:var(--muted)}
.day i{width:100%;max-width:40px;aspect-ratio:1;border-radius:12px;background:var(--surface);display:grid;place-items:center;font-style:normal;font-family:var(--display);font-size:17px;color:var(--ink)}
.day.done i{background:var(--leaf);color:#fff}
.day.today i{box-shadow:inset 0 0 0 2px var(--accent)}

/* hero */
.hero{background:var(--leaf-deep);color:#fff;border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:14px}
.hero .lbl{color:rgba(255,255,255,.72)}
.hero h2{font-size:38px}
.hero .meta{display:flex;gap:18px;flex-wrap:wrap}
.hero .meta div{display:flex;flex-direction:column}
.hero .meta b{font-family:var(--display);font-size:26px;line-height:1}
.hero .meta span{font-size:11px;opacity:.78;font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.hero .figs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.hero .figs .bf{background:rgba(255,255,255,.92);border-radius:12px}
.hero .btn.ghost{background:rgba(255,255,255,.14);color:#fff}
.banner{display:flex;gap:12px;align-items:center;justify-content:space-between;background:var(--accent-soft);border-radius:16px;padding:12px 14px}
.banner p{margin:0;font-weight:600;font-size:14px}

.pbar{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden}
.pbar i{display:block;height:100%;background:var(--leaf);border-radius:99px}
.pbar.acc i{background:var(--accent)}
.pbar.blue i{background:var(--blue)}

/* grids & cards */
.cats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cat{background:var(--surface);border-radius:18px;padding:14px 14px 8px;display:flex;flex-direction:column;gap:4px;text-align:left;min-height:160px}
.cat .bf{width:78px;align-self:flex-end;margin-top:auto}
.cat h4{font-size:19px}
.cat small{color:var(--muted);font-size:12px;font-weight:600}
.cat.locked{opacity:.55}
.list{background:var(--surface);border-radius:18px;overflow:hidden}
.li{display:flex;align-items:center;gap:12px;padding:11px 14px;border-top:1px solid var(--line);width:100%;text-align:left}
.li:first-child{border-top:0}
.li .bf{width:52px;flex:none;background:var(--surface2);border-radius:12px}
.li .t{flex:1;min-width:0}
.li .t b{display:block;font-weight:700;font-size:15px}
.li .t span{font-size:12.5px;color:var(--muted)}
.li .r{font-size:12px;font-weight:700;color:var(--muted);white-space:nowrap;text-align:right}
.lv{display:inline-flex;gap:3px;vertical-align:middle}
.lv i{width:6px;height:6px;border-radius:2px;background:var(--line)}
.lv i.on{background:var(--accent)}
.search{width:100%;height:44px;border-radius:12px;border:0;background:var(--surface);padding:0 14px}

.pd{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;background:var(--surface);width:100%;text-align:left}
.pd .n{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--surface2);font-family:var(--display);font-size:18px;flex:none}
.pd.done .n{background:var(--good);color:#fff}
.pd.next{box-shadow:inset 0 0 0 2px var(--accent)}
.pd.next .n{background:var(--accent);color:#fff}
.pd .t{flex:1}
.pd .t b{display:block}
.pd .t span{font-size:12.5px;color:var(--muted)}

.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.tiles.t3{grid-template-columns:repeat(3,1fr)}
.tile{background:var(--surface);border-radius:16px;padding:12px 14px}
.tile b{display:block;font-family:var(--display);font-size:32px;line-height:1.05}
.tile small{font-size:12px;color:var(--muted)}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:10px;font-family:var(--body)}
.chart .bar{fill:var(--leaf)}
.chart .bar.cur{fill:var(--accent)}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .ln{fill:none;stroke:var(--accent);stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}
.chart .dot{fill:var(--accent)}
.chart .tgt{stroke:var(--accent);stroke-width:1.2;stroke-dasharray:4 3}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,1fr);gap:4px;overflow-x:auto}
.heat i{width:100%;min-width:14px;aspect-ratio:1;border-radius:4px;background:var(--surface2)}
.heat i.h1{background:color-mix(in srgb,var(--leaf) 35%,var(--surface2))}
.heat i.h2{background:color-mix(in srgb,var(--leaf) 65%,var(--surface2))}
.heat i.h3{background:var(--leaf)}
.heat i.fut{background:transparent}
.empty{padding:24px 16px;text-align:center;color:var(--muted)}

/* form */
.field{display:flex;flex-direction:column;gap:6px}
.field label,.field .fl{font-weight:700;font-size:13px}
.inp{height:46px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);padding:0 12px;width:100%;min-width:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stepper{display:flex;align-items:center;background:var(--surface2);border-radius:12px;height:44px;overflow:hidden}
.stepper button{width:40px;height:44px;font-size:20px;font-weight:700;flex:none}
.stepper span{flex:1;text-align:center;font-weight:700;white-space:nowrap}
.sw{position:relative;width:48px;height:28px;border-radius:99px;background:var(--line);flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .2s}
.sw.on{background:var(--leaf)}
.sw.on::after{transform:translateX(20px)}
textarea.inp{height:110px;padding:10px 12px;resize:vertical;font-size:12px;font-family:ui-monospace,Menlo,monospace}

/* tabbar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
.tabbar nav{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tabbar button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;font-size:10.5px;font-weight:600;color:var(--muted)}
.tabbar button.on{color:var(--accent)}
.ico{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ico.s{width:18px;height:18px}

/* sheet */
.shade{position:fixed;inset:0;z-index:75;background:rgba(6,12,8,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92vh;overflow-y:auto;border-radius:24px 24px 0 0;padding:10px 16px calc(24px + env(safe-area-inset-bottom,0px));animation:up .25s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
.grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 10px}
.sheet-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.sheet h2{font-size:32px}
.x{width:36px;height:36px;border-radius:50%;background:var(--surface);display:grid;place-items:center;flex:none}
.bigfig{background:var(--surface);border-radius:20px;display:flex;justify-content:center;padding:6px}
.bigfig .bf{width:min(250px,72%)}
.sticky-cta{position:sticky;bottom:calc(-24px - env(safe-area-inset-bottom,0px));margin:16px -16px 0;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,var(--bg) 30%);display:flex;gap:10px}
.pick{display:flex;align-items:center;gap:12px;padding:10px 14px;border-top:1px solid var(--line);width:100%;text-align:left}
.pick:first-child{border-top:0}
.pick .o{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-weight:800;font-size:13px;flex:none}
.pick.on .o{background:var(--accent);border-color:var(--accent);color:#fff}

/* bradi svg */
svg.bf{display:block;width:100%;height:auto;aspect-ratio:1;max-width:100%}

/* fullscreen overlays */
.ovl{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;padding:calc(10px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px))}
.player{background:var(--pbg,#1F4D36);color:#fff;transition:background .35s}
.player.rest{--pbg:#E2502F}
.player.prep{--pbg:#1B2A20}
.player .inner,.gymx .inner{max-width:560px;width:100%;margin:0 auto;display:flex;flex-direction:column;flex:1;min-height:0;gap:10px}
.pl-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.player .x{background:rgba(255,255,255,.16);color:#fff}
.pl-bar{display:flex;gap:3px;height:5px}
.pl-bar i{flex:1;border-radius:9px;background:rgba(255,255,255,.25)}
.pl-bar i.d{background:#fff}
.pl-bar i.c{background:rgba(255,255,255,.65)}
.pl-phase{font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;opacity:.85}
.pl-name{font-family:var(--display);font-size:clamp(34px,9vw,52px);font-weight:700;line-height:1}
.pl-cue{font-size:14px;opacity:.9;max-width:44ch}
.pl-stage{flex:1;min-height:120px;display:flex;align-items:center;justify-content:center}
.pl-stage .bf{height:100%;max-height:310px;width:auto;background:rgba(255,255,255,.93);border-radius:28px}
.pl-mid{display:flex;align-items:center;justify-content:space-between;gap:12px}
.ring{position:relative;width:128px;height:128px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:8}
.ring .bgc{stroke:rgba(255,255,255,.22)}
.ring .fgc{stroke:#fff;stroke-linecap:round}
.ring span{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:54px;font-variant-numeric:tabular-nums}
.pl-next{font-size:14px;opacity:.9;text-align:right}
.pl-next b{display:block;font-family:var(--display);font-size:22px;line-height:1.05}
.pl-ctrl{display:flex;align-items:center;justify-content:center;gap:28px;padding-top:6px}
.pl-ctrl button{width:56px;height:56px;border-radius:50%;background:rgba(255,255,255,.16);display:grid;place-items:center}
.pl-ctrl button.pp{width:76px;height:76px;background:#fff;color:var(--pbg,#1F4D36)}
.pl-ctrl .ico{width:26px;height:26px}
.pl-over{position:absolute;inset:0;background:rgba(6,12,8,.72);display:flex;align-items:center;justify-content:center;padding:16px;z-index:2}
.pl-over .card{color:var(--ink);max-width:380px;width:100%;display:flex;flex-direction:column;gap:10px}
.done-wrap{display:flex;flex-direction:column;gap:16px;flex:1;justify-content:center;overflow-y:auto}
.done-wrap h2{font-size:56px;font-weight:700}
.done-wrap .bf{width:150px;align-self:center;background:rgba(255,255,255,.93);border-radius:24px}
.done-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.done-stats div{background:rgba(255,255,255,.14);border-radius:14px;padding:10px 12px}
.done-stats b{display:block;font-family:var(--display);font-size:28px;line-height:1.05}
.done-stats span{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;opacity:.85}
.fb{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.fb button{background:rgba(255,255,255,.14);border-radius:14px;padding:12px 6px;font-weight:700;font-size:13px}
.fb button.on{background:#fff;color:var(--leaf-deep)}
.player .btn.white{background:#fff;color:var(--leaf-deep)}
.player .btn.glass{background:rgba(255,255,255,.16);color:#fff}

/* gym session */
.gymx{background:var(--bg);color:var(--ink);padding-bottom:0}
.gymx .inner{overflow:hidden}
.gx-scroll{flex:1;overflow-y:auto;margin-inline:-16px;padding:4px 16px 140px}
.gx-ex{background:var(--surface);border-radius:18px;padding:12px 12px 10px;margin-bottom:12px}
.gx-head{display:flex;gap:10px;align-items:center}
.gx-head .bf{width:54px;background:var(--surface2);border-radius:12px;flex:none}
.gx-head b{display:block;font-size:16px}
.gx-sets{display:grid;grid-template-columns:28px 1fr 1fr 44px;gap:6px 8px;align-items:center;margin-top:10px}
.gx-sets .h{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.gx-sets .n{font-weight:700;color:var(--muted);text-align:center}
.gx-sets input{height:42px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface2);text-align:center;font-weight:700;font-size:16px;width:100%;min-width:0}
.gx-sets .ck{width:44px;height:42px;border-radius:10px;background:var(--surface2);display:grid;place-items:center;color:var(--muted)}
.gx-sets .ck.on{background:var(--good);color:#fff}
.gx-sets .done input{background:color-mix(in srgb,var(--good) 12%,var(--surface));border-color:transparent}
.restbar{position:absolute;left:0;right:0;bottom:0;background:var(--leaf-deep);color:#fff;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:12px;z-index:3}
.restbar .t{font-family:var(--display);font-size:34px;font-weight:700;min-width:84px;font-variant-numeric:tabular-nums}
.restbar button{height:38px;padding:0 12px;border-radius:99px;background:rgba(255,255,255,.16);font-weight:700;font-size:13px}
.restbar .pbar{flex:1;background:rgba(255,255,255,.2)}
.restbar .pbar i{background:#fff}

/* wod */
.wodx{background:#1B2A20;color:#fff;transition:background .35s}
.wodx.work{background:#1F4D36}
.wodx.rest{background:#E2502F}
.wodx .inner{max-width:560px;width:100%;margin:0 auto;display:flex;flex-direction:column;flex:1;gap:12px;min-height:0}
.clock{font-family:var(--display);font-weight:700;font-size:clamp(84px,26vw,150px);line-height:1;text-align:center;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.wod-mv{background:rgba(255,255,255,.1);border-radius:16px;padding:12px 14px;font-weight:600}
.wod-mv div{padding:2px 0}
.bigbtn{height:84px;border-radius:24px;background:#fff;color:#1F4D36;font-family:var(--display);font-size:28px;font-weight:700;width:100%}
.wodx .x{background:rgba(255,255,255,.16);color:#fff}
.wodx .btn.glass{background:rgba(255,255,255,.16);color:#fff}
.wodx .inp{background:rgba(255,255,255,.95)}

/* nutri */
.rings{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.rg{background:var(--surface);border-radius:18px;padding:12px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.rg svg{width:84px;height:84px;transform:rotate(-90deg)}
.rg circle{fill:none;stroke-width:9;stroke-linecap:round}
.rg .bgc{stroke:var(--surface2)}
.rg b{font-family:var(--display);font-size:20px;line-height:1}
.rg small{font-size:11.5px;color:var(--muted)}
.water{display:flex;gap:6px;flex-wrap:wrap}
.water button{width:34px;height:42px;border-radius:6px 6px 12px 12px;border:2px solid var(--blue);background:transparent;position:relative;overflow:hidden}
.water button.on{background:var(--blue)}
.idea{display:flex;gap:12px;align-items:center;padding:12px 14px;border-top:1px solid var(--line)}
.idea:first-child{border-top:0}
.idea .t{flex:1}
.idea .t b{display:block;font-size:14.5px}
.idea .t span{font-size:12.5px;color:var(--muted)}

/* plates */
.plates{display:flex;align-items:center;gap:3px;min-height:74px;padding:6px 0;overflow-x:auto}
.plates .barx{width:40px;height:10px;background:#9AA5A0;border-radius:3px;flex:none}
.plates i{display:grid;place-items:center;border-radius:4px;color:#fff;font-size:10px;font-weight:800;font-style:normal;flex:none;writing-mode:vertical-rl}

.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;z-index:90;max-width:calc(100% - 32px);text-align:center}
.shareimg{width:100%;border-radius:18px;display:block}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}.player,.wodx{transition:none}}
@media (max-width:370px){.hero h2{font-size:32px}.ring{width:108px;height:108px}.ring span{font-size:46px}.bcard{grid-template-columns:96px 1fr}.bcard .bf{width:96px}}

const totalWorkouts=()=>S.history.length;

function daysSinceLast(){if(!S.history.length)return null;const last=S.history.reduce((a,h)=>h.date>a?h.date:a,'');const d0=parseISO(iso(new Date(last)));return Math.round((parseISO(today())-d0)/864e5)}
function bradiMood(){const d=daysSinceLast();const s=streak();
  if(d===null)return{mood:'relax',pose:'sway',msg:'Ciao, sono Bradi. Lento, ma ci arrivo. Partiamo?'};
  if(d===0)return{mood:'carico',pose:'cheer',msg:s>=7?`${s} giorni di fila. Nemmeno io ci credo.`:'Fatto anche oggi. Chi l’avrebbe detto.'};

}

function buildWorkout(catId,seedStr,mul=1){
  const c=CATS[catId];const r=rng(hash(seedStr));const lv=S.profile.level;let ex;
  if(c.fixed){ex=c.fixed.slice();if(lv===1)ex=ex.map(id=>id==='pu'?'kpu':id)}
  else{let pool=EX.filter(e=>c.types.includes(e.type)&&avail(e)&&!e.warm&&(!c.equip||e.equip===c.equip));
    let fit=pool.filter(e=>e.level<=lv);if(fit.length<c.n)fit=pool;
    const groups=c.types.map(t=>shuffle(fit.filter(e=>e.type===t),r));ex=[];let k=0;
    while(ex.length<c.n&&groups.some(g=>g.length)){const g=groups[k++%groups.length];if(g.length)ex.push(g.shift().id)}}
  let[w,rs]=baseTimes();if(c.work){w=c.work;rs=c.rest}if(c.restMul)rs=Math.max(10,Math.round(rs*c.restMul/5)*5);
  w=Math.round(w*mul/5)*5;
  const warm=c.warm?shuffle(EX.filter(e=>e.warm),r).slice(0,3).map(e=>e.id):[];
  const cool=catId==='stretch'||c.fixed?[]:shuffle(EX.filter(e=>e.type==='stretch'&&!e.warm),r).slice(0,2).map(e=>e.id);
  return{cat:catId,name:c.name,ex,warm,cool,work:w,rest:rs,rounds:c.rounds,seed:seedStr};
}
function steps(w){
  const s=[];const all=[...w.warm,...w.ex,...w.cool];if(!all.length)return s;
  s.push({k:'prep',ex:all[0],d:10});
  w.warm.forEach(id=>{s.push({k:'work',ex:id,d:30,ph:'Riscaldamento'});s.push({k:'rest',d:10})});
  for(let r=0;r<w.rounds;r++)w.ex.forEach((id,i)=>{s.push({k:'work',ex:id,d:w.work,ph:w.rounds>1?`Giro ${r+1} di ${w.rounds}`:'Circuito'});
    const last=i===w.ex.length-1;if(!last&&w.rest>0)s.push({k:'rest',d:w.rest});else if(last&&r<w.rounds-1)s.push({k:'rest',d:30,round:1})});
  if(w.cool.length){s.push({k:'rest',d:10});w.cool.forEach((id,i)=>{s.push({k:'work',ex:id,d:30,ph:'Defaticamento'});if(i<w.cool.length-1)s.push({k:'rest',d:5})})}
  if(s[s.length-1].k==='rest')s.pop();
  s.forEach((x,i)=>{if(x.k!=='work'){const n=s.slice(i+1).find(y=>y.k==='work');x.next=n?n.ex:null}});
  return s;
}

function byDay(){const m={};S.history.forEach(h=>{const k=iso(new Date(h.date));m[k]=(m[k]||0)+h.sec/60});return m}
function streak(){const m=byDay();let d=new Date();if(!m[iso(d)])d=addDays(d,-1);let n=0;while(m[iso(d)]){n++;d=addDays(d,-1)}return n}
function bestStreak(){const ks=Object.keys(byDay()).sort();let b=0,c=0,prev=null;ks.forEach(k=>{c=prev&&iso(addDays(prev,1))===k?c+1:1;b=Math.max(b,c);prev=parseISO(k)});return b}
function addHistory(rec){const before=userStage();S.history.push(rec);save();const after=userStage();return after>before?after:0}

  const s=P.st[P.i];P.rem-=dt;
  if(s.k==='work'){P.worked+=dt/1000;P.kcal+=kcalOf(EXM[s.ex].met,dt/1000);P.doneWork.add(s.ex)}else P.kcal+=kcalOf(2,dt/1000);

function finishPlayer(){

  const sec=Math.round((Date.now()-P.start)/1000);
  let up=0;const rec={type:'body',date:new Date().toISOString(),name:P.w.name,cat:P.w.cat||'custom',sec,kcal:Math.round(P.kcal),n:P.doneWork.size,plan:P.w.plan||null};

function wodDur(w){return w.type==='amrap'||w.type==='fortime'?w.cap*60:w.type==='emom'?w.min*w.every:(w.work+w.rest)*w.rounds*w.mv.length+60*(w.mv.length-1)-w.rest}
function wodSched(w){const s=[{k:'prep',d:10,label:'Preparati'}];
  if(w.type==='amrap')s.push({k:'work',d:w.cap*60,label:'AMRAP'});

  else if(w.type==='emom')for(let i=0;i<w.min;i++)s.push({k:'work',d:w.every,label:`Minuto ${i+1} di ${w.min}`,i});

/* ---- Progressi ---- */
function vProg(){
  const H=S.history;const tot=H.length;const min=Math.round(H.reduce((a,h)=>a+h.sec,0)/60);const kc=Math.round(H.reduce((a,h)=>a+h.kcal,0));
  const m=byDay();const ws=weekStart(new Date());
  const weeks=[];for(let i=7;i>=0;i--){const s=addDays(ws,-7*i);let v=0;for(let d=0;d<7;d++)v+=m[iso(addDays(s,d))]||0;weeks.push({s,v:Math.round(v)})}
  const top=Math.ceil(Math.max(30,...weeks.map(w=>w.v))/30)*30;const W=320,Hh=150,L=28,B=22,bw=(W-L-8)/8;
  const bars=weeks.map((w,i)=>{const h=(Hh-B-10)*w.v/top;const x=L+i*bw+bw*.18;return `<rect class="bar ${i===7?'cur':''}" x="${x.toFixed(1)}" y="${(Hh-B-h).toFixed(1)}" width="${(bw*.64).toFixed(1)}" height="${Math.max(h,w.v?2:0).toFixed(1)}" rx="3"/><text x="${(x+bw*.32).toFixed(1)}" y="${Hh-6}" text-anchor="middle">${w.s.getDate()}/${w.s.getMonth()+1}</text>`}).join('');
  const grid=[0,.5,1].map(f=>{const y=(Hh-B-(Hh-B-10)*f).toFixed(1);return `<line class="grid" x1="${L}" x2="${W-4}" y1="${y}" y2="${y}"/><text x="${L-6}" y="${+y+3}" text-anchor="end">${Math.round(top*f)}</text>`}).join('');
  const start=addDays(ws,-77);let cells='';for(let i=0;i<84;i++){const d=addDays(start,i);const v=m[iso(d)]||0;cells+=`<i class="${d>new Date()?'fut':v>=30?'h3':v>=15?'h2':v>0?'h1':''}" title="${iso(d)}: ${Math.round(v)} min"></i>`}
  const typeN={body:'Corpo libero',gym:'Palestra',wod:'WOD'};const cnt=t=>H.filter(h=>h.type===t).length;
  const prs=prList().slice(0,5);
  return `<header class="top"><h1>Progressi</h1></header>
  <div class="bcard">${bf(userStage()===3?'cheer':'curl',userStage()===3?'carico':'relax',{prop:userStage()===3?'':'db'})}<div><div class="bubble">${tot?`${tot} allenamenti insieme. Guarda come sono cambiato.`:'Il primo allenamento è il più difficile. Poi diventa un’abitudine.'}</div>${stageBlock()}</div></div>
  <div class="tiles" style="margin-top:14px">
   <div class="tile"><span class="lbl">Allenamenti</span><b class="num">${tot}</b><small>${cnt('body')} corpo libero · ${cnt('gym')} palestra · ${cnt('wod')} WOD</small></div>
   <div class="tile"><span class="lbl">Minuti</span><b class="num">${min}</b></div>
   <div class="tile"><span class="lbl">Kcal stimate</span><b class="num">${kc}</b></div>
   <div class="tile"><span class="lbl">Serie migliore</span><b class="num">${bestStreak()}<small style="font-size:15px"> giorni</small></b></div>
  </div>
  <section class="sec"><div class="sec-h"><h3>Minuti a settimana</h3><span class="muted small">ultime 8</span></div>
   <div class="card"><svg class="chart" viewBox="0 0 ${W} ${Hh}" role="img" aria-label="Minuti di allenamento per settimana">${grid}${bars}</svg></div></section>
  <section class="sec"><div class="sec-h"><h3>Costanza</h3><span class="muted small">12 settimane</span></div><div class="card"><div class="heat">${cells}</div></div></section>
  ${prs.length?`<section class="sec"><div class="sec-h"><h3>Record in palestra</h3></div><div class="list">${prs.map(p=>`<button class="li" data-a="gEx" data-v="${p.e.id}">${ico('trophy')}<div class="t"><b>${esc(p.e.name)}</b><span>${fmtKg(p.set.kg)} kg × ${p.set.reps}</span></div><span class="r num">${fmtKg(Math.round(p.best*2)/2)} kg</span></button>`).join('')}</div></section>`:''}
  <section class="sec"><div class="sec-h"><h3>Storico</h3></div>
   ${H.length?`<div class="list">${H.slice().reverse().slice(0,30).map(h=>`<div class="li"><div class="t"><b>${esc(h.name)}</b><span>${new Date(h.date).toLocaleDateString('it-IT',{weekday:'short',day:'numeric',month:'short'})} · ${typeN[h.type]||''} · ${fmtMin(h.sec)} min</span></div><span class="r num">${Math.round(h.kcal)} kcal</span></div>`).join('')}</div>`
   :`<div class="card empty">Completa il primo allenamento: qui vedrai minuti, calorie e costanza.</div>`}</section>`;
}

   <div class="three">${st('work',5,10,120,' s')}${st('rest',5,0,120,' s')}${st('rounds',1,1,8,'')}</div>
   <div class="sec-h"><h3>Esercizi</h3><span class="muted num">${bsel.length} scelti</span></div>
   <div class="list">${EX.filter(avail).map(e=>{const i=bsel.indexOf(e.id);return `<button class="pick ${i>=0?'on':''}" data-a="bpick" data-v="${e.id}"><span class="o">${i>=0?i+1:''}</span><span style="flex:1"><b style="display:block">${esc(e.name)}</b><span class="muted small">${esc(TYPES[e.type])} · ${esc(e.muscles)}</span></span></button>`}).join('')}</div></div>
  <div class="sticky-cta"><button class="btn full" data-a="bsave">Salva allenamento</button></div>`);
  if(keep){const s=$('.sheet');s.style.animation='none';s.scrollTop=sc}
}
function openGymRoutine(rid){const r=RM[rid];
  openSheet(`${sheetTop(r.name,r.desc)}<section class="sec" style="margin-top:12px"><div class="list">${r.ex.map(([id,sets,reps])=>{const e=GXM[id];const lp=lastPerf(id);const sg=suggestKg(id,reps);
   return `<button class="li" data-a="gEx" data-v="${id}">${gFig(e)}<div class="t"><b>${esc(e.name)}</b><span>${sets} × ${reps}${e.unit==='s'?' s':''} · ${esc(perfTxt(id,lp))}</span></div>${sg?`<span class="r num">${fmtKg(sg)} kg</span>`:''}</button>`}).join('')}</div></section>
   <div class="sticky-cta"><button class="btn full" data-a="gStart" data-v="${rid}">${ico('play')}Inizia la scheda</button></div>`)}
function openGymEx(id){const e=GXM[id];
  const pts=[];for(const s of S.gym.sessions)for(const x of s.ex)if(x.id===id&&x.sets.length)pts.push({d:s.date,v:e.unit==='s'?Math.max(...x.sets.map(t=>t.reps)):Math.max(...x.sets.map(t=>e1rm(t.kg,t.reps))),sets:x.sets});
  const last=pts.slice(-10);let chart='';
  if(last.length>1){const W=320,H=130,L=34,B=18;const mn=Math.min(...last.map(p=>p.v)),mx=Math.max(...last.map(p=>p.v));const lo=Math.floor(mn*.95),hi=Math.ceil(mx*1.05)||1;
   const X=i=>L+i*(W-L-10)/(last.length-1),Y=v=>H-B-(H-B-10)*(v-lo)/((hi-lo)||1);
   chart=`<div class="card"><span class="lbl">${e.unit==='s'?'Secondi migliori':'Massimale stimato (kg)'}</span><svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Andamento"><line class="grid" x1="${L}" x2="${W-6}" y1="${Y(hi).toFixed(1)}" y2="${Y(hi).toFixed(1)}"/><line class="grid" x1="${L}" x2="${W-6}" y1="${Y(lo).toFixed(1)}" y2="${Y(lo).toFixed(1)}"/><text x="${L-6}" y="${(Y(hi)+3).toFixed(1)}" text-anchor="end">${hi}</text><text x="${L-6}" y="${(Y(lo)+3).toFixed(1)}" text-anchor="end">${lo}</text>
    <polyline class="ln" points="${last.map((p,i)=>X(i).toFixed(1)+','+Y(p.v).toFixed(1)).join(' ')}"/>${last.map((p,i)=>`<circle class="dot" cx="${X(i).toFixed(1)}" cy="${Y(p.v).toFixed(1)}" r="${i===last.length-1?4:2.6}"/>`).join('')}
    ${last.map((p,i)=>i===0||i===last.length-1?`<text x="${X(i).toFixed(1)}" y="${H-3}" text-anchor="${i?'end':'start'}">${new Date(p.d).toLocaleDateString('it-IT',{day:'numeric',month:'short'})}</text>`:'').join('')}</svg></div>`}
  const best=bestE1(id);
  openSheet(`${sheetTop(e.name,e.muscles)}<div class="bigfig" style="margin-top:12px">${gFig(e)}</div>
   <div class="tiles" style="margin-top:12px"><div class="tile"><small>Attrezzo</small><b style="font-size:20px">${esc(e.equip)}</b></div><div class="tile"><small>${e.unit==='s'?'Sessioni':'Massimale stimato'}</small><b class="num">${e.unit==='s'?pts.length:best?fmtKg(Math.round(best*2)/2)+' kg':'—'}</b></div></div>
   <section class="sec">${chart||`<div class="card empty">Dopo due sessioni vedrai qui l’andamento.</div>`}</section>
   ${pts.length?`<section class="sec"><div class="sec-h"><h3>Storico</h3></div><div class="list">${pts.slice(-6).reverse().map(p=>`<div class="li"><div class="t"><b>${new Date(p.d).toLocaleDateString('it-IT',{weekday:'short',day:'numeric',month:'short'})}</b><span>${p.sets.map(t=>`${fmtKg(t.kg)}×${t.reps}`).join(' · ')}</span></div></div>`).join('')}</div></section>`:''}
   <span class="muted small" style="display:block;margin-top:12px">Il massimale stimato usa la formula di Epley: kg × (1 + ripetizioni/30).</span>`)}
function openGymPicker(){openSheet(`${sheetTop('Aggiungi esercizio')}<div class="list" style="margin-top:12px">${GX.map(e=>`<button class="li" data-a="gAddEx" data-v="${e.id}">${gFig(e)}<div class="t"><b>${esc(e.name)}</b><span>${esc(e.muscles)} · ${esc(e.equip)}</span></div>${ico('plus','ico s')}</button>`).join('')}</div>`)}
function openWodSheet(id){const w=WM[id];const rs=S.wod.results.filter(r=>r.wid===id).slice(-5).reverse();const b=wodBest(id);
  openSheet(`${sheetTop(w.name,WTYPE[w.type].n+' · '+fmtMin(wodDur(w))+' min')}<div class="bigfig" style="margin-top:12px">${bf(w.pose,'sforzo',{prop:w.prop,hl:'all'})}</div>
   <div class="card stack" style="margin-top:12px"><span class="lbl">${esc(WTYPE[w.type].d)}</span>${w.mv.map(m=>`<div style="font-weight:600">${esc(m)}</div>`).join('')}<span class="muted small">Attrezzi: ${esc(w.eq)}. Carichi indicati uomo/donna: riducili se serve, la tecnica viene prima.</span></div>
   ${b?`<div class="tile" style="margin-top:12px"><small>Il tuo record</small><b>${esc(b.score)}</b></div>`:''}
   ${rs.length?`<section class="sec"><div class="sec-h"><h3>Risultati</h3></div><div class="list">${rs.map(r=>`<div class="li"><div class="t"><b>${esc(r.score)}</b><span>${new Date(r.date).toLocaleDateString('it-IT',{day:'numeric',month:'short'})}${r.note?' · '+esc(r.note):''}</span></div></div>`).join('')}</div></section>`:''}
   <div class="sticky-cta"><button class="btn full" data-a="wStart" data-v="${id}">${ico('play')}Inizia il WOD</button></div>`)}
/* ================= AZIONI ================= */
const A={
 tab:d=>{closeSheet();S.nav.tab=d.v;save();render();scrollTo(0,0)},
 trainSub:d=>{S.nav.train=d.v;save();render()},
 close:closeSheet,
 shade:(d,el,e)=>{if(e.target===el)closeSheet()},
 /* corpo libero */
 openCat:d=>{const c=CATS[d.v];if(c.equip==='dumbbell'&&!S.profile.dumbbells){toast('Attiva “Ho dei manubri a casa” nel profilo.');return}openWorkout(buildWorkout(d.v,seedFor(d.v)))},
 openPlan:d=>{const day=planWeeks().flat().find(x=>x.key===d.v);if(day)openWorkout(planWorkout(day))},
 planSheet:openPlanSheet,
 openCustom:d=>{const i=+d.v;openWorkout({...S.custom[i],custom:true,idx:i})},
 detail:()=>openWorkout(current),
 start:()=>startPlayer(current),
 regen:()=>{const c=current.cat;S.bump[c]=(S.bump[c]||0)+1;save();openWorkout(buildWorkout(c,seedFor(c)));$('.sheet').style.animation='none';render()},
 exInfo:d=>openEx(d.v),
 exLib:()=>openExLib(),
 filter:d=>{S.nav.filter=d.v;save();openExLib(true)},
 tryEx:d=>{const[w,r]=baseTimes();startPlayer({name:EXM[d.v].name,ex:[d.v],warm:[],cool:[],work:w,rest:r,rounds:3})},
 builder:()=>{bsel=[];const[w,r]=baseTimes();bcfg={name:'',work:w,rest:r,rounds:2};openBuilder()},
 bpick:d=>{const i=bsel.indexOf(d.v);i>=0?bsel.splice(i,1):bsel.push(d.v);openBuilder(true)},
 bstep:d=>{bcfg[d.k]=clamp(bcfg[d.k]+ +d.v,+d.min,+d.max);openBuilder(true)},
 bsave:()=>{if(!bsel.length){toast('Scegli almeno un esercizio.');return}S.custom.push({name:bcfg.name.trim()||'Il mio allenamento',ex:bsel.slice(),warm:[],cool:[],work:bcfg.work,rest:bcfg.rest,rounds:bcfg.rounds});save();closeSheet();S.nav.tab='train';S.nav.train='body';render();toast('Allenamento salvato')},
 delCustom:(d,el)=>{if(el.dataset.c!=='1'){el.dataset.c='1';el.innerHTML='Tocca di nuovo per eliminare';return}S.custom.splice(+d.v,1);save();closeSheet();render();toast('Allenamento eliminato')},
 restartPlan:()=>{$('#rp').innerHTML=`<div class="card stack"><b>Ricominciare dalla settimana 1?</b><span class="muted small">Lo storico resta, si azzerano solo le spunte del piano.</span><div class="row"><button class="btn danger sm" data-a="restartYes">Ricomincia</button><button class="btn ghost sm" data-a="planSheet">Annulla</button></div></div>`},
 restartYes:()=>{S.plan={start:today(),done:{}};save();closeSheet();render();toast('Piano ricominciato')},
 /* player */
 pp:()=>setPause(!P.run),
 pnext:()=>go(P.i+1),
 pprev:()=>{go(P.st[P.i].d*1000-P.rem>3000?P.i:P.i-1)},
 quit:()=>{P.over=true;setPause(false)},
 resume:()=>{P.over=false;setPause(true)},
 quitSave:()=>{P.over=false;finishPlayer()},
 quitDiscard:()=>closePlayer(),
 fb:(d,el)=>{const v=+d.v;S.profile.adj=clamp((S.profile.adj||0)+v,-2,2);save();el.parentNode.querySelectorAll('button').forEach(b=>{b.classList.toggle('on',b===el);b.disabled=true});toast(v>0?'Prossimi intervalli più lunghi':v<0?'Prossimi intervalli più brevi':'Tempi confermati')},
 pclose:closePlayer,
 shareBody:()=>{const r=P.rec;shareCard({title:r.name,sub:new Date().toLocaleDateString('it-IT',{weekday:'long',day:'numeric',month:'long'}),stats:[[fmtMin(r.sec)+'′','minuti'],[String(r.kcal),'kcal'],[String(streak()),'giorni di fila']],pose:'cheer',mood:'carico'})},
 /* palestra */
 gStartFree:()=>{if(S.gym.draft&&!G){toast('Hai già un allenamento in corso: riprendilo o terminalo.');return}startGym(null);openGymPicker()},
 gRoutine:d=>openGymRoutine(d.v),
 gStart:d=>{if(S.gym.draft&&!G){closeSheet();toast('Hai già un allenamento in corso: riprendilo o terminalo.');return}startGym(d.v)},
 gResumeDraft:()=>{G=S.gym.draft;openGym()},
 gEx:d=>openGymEx(d.v),
 gPick:openGymPicker,
 gAddEx:d=>{const reps=GXM[d.v].unit==='s'?45:10;G.ex.push(makeGEx(d.v,3,reps));save();closeSheet();paintGym();const s=$('.gx-scroll');if(s)s.scrollTop=s.scrollHeight},
 gDelEx:(d,el)=>{if(el.dataset.c!=='1'){el.dataset.c='1';el.style.background='var(--accent)';el.style.color='#fff';toast('Tocca di nuovo per rimuovere l’esercizio');return}G.ex.splice(+d.e,1);save();paintGym()},
 gApply:d=>{const x=G.ex[+d.e];x.sets.forEach(s=>{if(!s.done)s.kg=+d.v});save();paintGym()},
 gAddSet:d=>{const x=G.ex[+d.e];const l=x.sets[x.sets.length-1]||{kg:'',reps:x.target||10};x.sets.push({kg:l.kg,reps:l.reps,done:false});save();paintGym()},
 gDelSet:d=>{const x=G.ex[+d.e];if(x.sets.length>1)x.sets.pop();save();paintGym()},
 gCheck:d=>{const x=G.ex[+d.e],s=x.sets[+d.s];s.done=!s.done;if(s.done){if(!(+s.reps>0)){s.done=false;toast('Inserisci le ripetizioni.');return}beep(880,.08);const r=gymRestFor(x.id);G.rest={end:Date.now()+r*1000,total:r}}save();paintGym()},
 gRest:d=>{const v=+d.v;if(!G.rest)return;if(v===0)G.rest=null;else{G.rest.end+=v*1000;G.rest.total=Math.max(1,G.rest.total+v)}paintGym()},
 gQuit:()=>{G.over=true;paintGym()},
 gResume:()=>{G.over=false;paintGym()},
 gFinish:()=>{G.over=false;finishGym()},
 gDiscard:()=>{delete S.gym.draft;save();closeGym()},
 gClose:closeGym,
 shareGym:()=>{const d=G.done;shareCard({title:G.name,sub:d.prs.length?`Nuovo record: ${d.prs[0].e.name}`:'Allenamento in palestra',stats:[[fmtMin(d.sec)+'′','minuti'],[String(d.nsets),'serie'],[Math.round(d.vol).toLocaleString('it-IT'),'kg sollevati']],pose:d.prs.length?'cheer':'curl',mood:d.prs.length?'carico':'sforzo',prop:d.prs.length?'':'db'})},
 plBar:d=>{S.nav.plBar=+d.v;save();render()},
 /* wod */
 wCfg:d=>openWodCfg(d.v),
 wcStep:d=>{const mv=$('#wcMv')?.value;if(mv!==undefined)wcfg.mv=mv;wcfg[d.k]=clamp(wcfg[d.k]+ +d.v,+d.min,+d.max);paintWodCfg()},
 wcStart:startWodCfg,
 wOpen:d=>openWodSheet(d.v),
 wStart:d=>startWod(WM[d.v]),
 wRound:d=>{W.rounds=Math.max(0,W.rounds+ +d.v);if(+d.v>0){beep(990,.08);say(`Giro ${W.rounds}`)}paintWod()},
 wFinish:()=>wodEnd(true),
 wPP:()=>{W.run=!W.run;W.last=performance.now();frozenAt=W.run?null:performance.now();paintWod()},
 wQuit:()=>{W.over=true;paintWod()},
 wResume:()=>{W.over=false;W.last=performance.now();paintWod()},
 wEndNow:()=>{W.over=false;wodEnd(true)},
 wDiscard:()=>closeWod(),
 wSave:wodSave,
 shareWod:d=>{shareCard({title:d.n,sub:'WOD '+WTYPE[d.t].n,stats:[[d.v,'risultato'],[String(streak()),'giorni di fila']],pose:'cheer',mood:'carico'})},
 doShare,
 /* nutri */
 meal:d=>{S.nav.meal=d.v;save();render()},
 water:d=>{const day=nDay();const v=+d.v*250;day.water=day.water===v?v-250:v;save();render()},
 addMeal:()=>{const name=$('#mName').value.trim();const k=Math.round(numIn($('#mKcal').value));const p=Math.round(numIn($('#mProt').value));
  if(!k&&!p){toast('Inserisci almeno le calorie o le proteine.');return}nDay().meals.push({meal:S.nav.meal,name:name||S.nav.meal,kcal:k,prot:p});save();render();toast('Pasto aggiunto')},
 addIdea:d=>{const[n,k,p]=IDEAS[S.nav.meal][+d.v];nDay().meals.push({meal:S.nav.meal,name:n,kcal:k,prot:p});save();render();toast('Aggiunto a '+S.nav.meal.toLowerCase())},
 delMeal:d=>{nDay().meals.splice(+d.v,1);save();render()},
 /* profilo */
 set:d=>{S.profile[d.k]=isNaN(+d.v)?d.v:+d.v;S.profile.setup=true;if(d.k==='sex')S.profile.nutriSet=true;if(d.k==='level')S.profile.adj=0;save();render()},
 setS:d=>{S.settings[d.k]=+d.v;save();render()},
 toggle:d=>{if(d.k==='dumbbells')S.profile.dumbbells=!S.profile.dumbbells;else S.settings[d.k]=!S.settings[d.k];save();render()},
 export:()=>{const txt=JSON.stringify(S);$('#ioBox').innerHTML=`<textarea class="inp" id="exTxt" readonly>${esc(txt)}</textarea>`;try{navigator.clipboard.writeText(txt).then(()=>toast('Backup copiato'),()=>{$('#exTxt').select();toast('Seleziona e copia il testo')})}catch(e){$('#exTxt').select()}},
 importOpen:()=>{$('#ioBox').innerHTML=`<div class="stack"><textarea class="inp" id="imTxt" placeholder="Incolla qui il backup"></textarea><button class="btn sm" data-a="importDo">Importa</button></div>`},
 importDo:()=>{try{const o=JSON.parse($('#imTxt').value);if(!o.profile)throw 0;Object.keys(S).forEach(k=>delete S[k]);Object.assign(S,structuredClone(DEF),o);for(const k of ['profile','settings','nav','gym','wod','plan'])S[k]=Object.assign(structuredClone(DEF[k]),S[k]||{});save();render();toast('Backup importato')}catch(e){toast('Il testo incollato non è un backup valido.')}},
 reset:()=>{$('#rs').innerHTML=`<div class="stack"><b>Cancellare profilo, storico, pesi, WOD e pasti?</b><div class="row"><button class="btn danger sm" data-a="resetYes">Cancella tutto</button><button class="btn ghost sm" data-a="tab" data-v="me">Annulla</button></div></div>`},
 resetYes:()=>{Object.keys(S).forEach(k=>delete S[k]);Object.assign(S,structuredClone(DEF));save();render();toast('Dati cancellati')},
 install:async()=>{if(!deferredInstall)return;deferredInstall.prompt();try{await deferredInstall.userChoice}catch(e){}deferredInstall=null;render()},
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el)return;const f=A[el.dataset.a];if(f){if(el.dataset.a!=='shade')e.preventDefault();f(el.dataset,el,e)}});
document.addEventListener('input',e=>{const t=e.target;
  if(t.dataset.gx){gymInput(t);return}
  switch(t.id){
   case'q':{S.nav.q=t.value;const pos=t.selectionStart;openExLib(true);const q=$('#q');q.focus();try{q.setSelectionRange(pos,pos)}catch(_){}break}
   case'pname':S.profile.name=t.value.slice(0,24);S.profile.setup=true;save();break;
   case'pweight':{const v=numIn(t.value);if(v>=30&&v<=250){S.profile.weight=v;save()}break}
   case'pheight':{const v=numIn(t.value);if(v>=120&&v<=230){S.profile.height=v;S.profile.nutriSet=true;save()}break}
   case'page':{const v=numIn(t.value);if(v>=14&&v<=100){S.profile.age=v;S.profile.nutriSet=true;save()}break}
   case'bname':bcfg.name=t.value;break;
   case'plTot':{S.nav.plTot=numIn(t.value);save();$('#plOut').innerHTML=plOut(platesFor(S.nav.plTot,S.nav.plBar??20));break}
  }});
document.addEventListener('keydown',e=>{if(!P||$('#player').hidden||P.over||!P.st)return;if(e.code==='Space'){e.preventDefault();setPause(!P.run)}if(e.key==='ArrowRight')go(P.i+1);if(e.key==='ArrowLeft')go(P.i-1)});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&(P||G||W))lockWake()});
addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstall=e;if(S.nav.tab==='me')render()});
try{if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)&&document.querySelector('link[rel=manifest]'))navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}
if(S.nav.tab==='plan')S.nav.tab='home';
render();requestAnimationFrame(figLoop);
</script>
